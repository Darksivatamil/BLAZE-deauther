<!Doctype html>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width, initial-scale=0.8, minimal-ui">
<meta name=theme-color content="#000000">
<meta name=description content="BLAZE // TEAM DARK">
<title>BLAZE // ATTACK</title>
<link rel=stylesheet type="text/css" href=style.css>
<script src="js/site.js"></script>
<script src="js/blaze.js"></script>
<script src="js/attack.js"></script>
<body>
<canvas id=matrix></canvas>
<div id=nav></div>
<div id=status></div>

<div class=container>
  <div class=row>
    <div class=col-12>
      <h1 class=header>ATTACK</h1>
      <p class=dim>Select targets on the SCAN page first. Start/stop each mode independently.</p>
      <button onclick="stopAll()" class=red>STOP ALL</button>
      <button onclick="load()" class="right cyan">RELOAD</button>
    </div>
  </div>

  <div class=row>
    <div class="col-12 card">
      <h2>ATTACK MODES</h2>
      <table>
        <tr><th>MODE</th><th>TARGETS</th><th>PKTS</th><th>START / STOP</th></tr>
        <tr>
          <td>DEAUTH</td><td id=deauthTargets>0</td><td id=deauthPkts>0/0</td>
          <td><button id=deauth onclick="start(0)" class=select>START</button></td>
        </tr>
        <tr>
          <td>BEACON</td><td id=beaconTargets>0</td><td id=beaconPkts>0/0</td>
          <td><button id=beacon onclick="start(1)" class=select>START</button></td>
        </tr>
        <tr>
          <td>PROBE</td><td id=probeTargets>0</td><td id=probePkts>0/0</td>
          <td><button id=probe onclick="start(2)" class=select>START</button></td>
        </tr>
        <tr>
          <td colspan=2>ALL PKTS/S</td><td colspan=2 id=allpkts>0</td>
        </tr>
      </table>
    </div>
  </div>
</div>
